name: 每日抓取考试汇总

# 每天北京时间 15:17 自动抓取同济就业网 + 各官网公告，生成 exam_info.json 并提交，
# 触发 Pages 重新部署 → 线上「考试汇总」每天自动更新。
on:
  schedule:
    - cron: '17 7 * * *'   # UTC 07:17 = 北京时间 15:17
  workflow_dispatch:       # 也支持手动在 Actions 页面点 Run workflow

permissions:
  contents: write

concurrency:
  group: fetch-exam-info
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 运行抓取脚本
        run: python3 fetch_exam_info.py --out exam_info.json

      - name: 提交（仅在内容变化时）
        run: |
          if [ -z "$(git status --porcelain exam_info.json)" ]; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exam_info.json
          git commit -m "chore: 每日更新考试汇总 $(date +'%Y-%m-%d')"
          git push
